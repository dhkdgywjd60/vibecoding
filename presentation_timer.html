<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넷플릭스 스타일 발표용 카운트다운 타이머</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Bebas Neue for Netflix-like ultra-bold display, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }

        .font-timer {
            font-family: 'Bebas Neue', Impact, sans-serif;
            letter-spacing: 0.05em;
        }

        /* 넷플릭스 시네마틱 비경 어둡기 및 글로우 효과 */
        .netflix-glow {
            text-shadow: 0 0 30px rgba(229, 9, 20, 0.7), 0 0 60px rgba(229, 9, 20, 0.4);
        }

        .white-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* 10초 이하 긴박한 반짝임 애니메이션 */
        @keyframes urgentBlink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                filter: drop-shadow(0 0 45px #E50914);
            }
            50% {
                opacity: 0.25;
                transform: scale(1.03);
                filter: drop-shadow(0 0 15px #E50914);
            }
        }

        .animate-urgent {
            animation: urgentBlink 0.5s infinite ease-in-out;
            color: #E50914 !important;
        }

        /* 배경 맥박 애니메이션 (10초 미만시 전체 화면 외곽선) */
        @keyframes bgPulse {
            0%, 100% { box-shadow: inset 0 0 50px rgba(229, 9, 20, 0.8); }
            50% { box-shadow: inset 0 0 150px rgba(229, 9, 20, 0.2); }
        }

        .bg-urgent-pulse {
            animation: bgPulse 0.8s infinite ease-in-out;
        }

        /* 버튼 호버 넷플릭스 시그니처 줌 및 글로우 */
        .btn-netflix {
            background-color: #E50914;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-netflix:hover {
            background-color: #f6121d;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.8);
        }

        .btn-netflix:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: rgba(45, 45, 45, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: rgba(80, 80, 80, 0.9);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .btn-preset {
            background: linear-gradient(180deg, rgba(30, 30, 30, 0.9) 0%, rgba(15, 15, 15, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-preset:hover {
            border-color: #E50914;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            transform: translateY(-2px);
        }

        .btn-preset.active {
            border-color: #E50914;
            background: #E50914;
            color: white;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
        }

        /* 상단 프로그레스 바 */
        #progress-bar {
            transition: width 0.3s linear, background-color 0.5s ease;
        }

        /* 커스텀 스크롤바 모달 */
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative select-none bg-black text-white">

    <!-- 상단 넷플릭스 스타일 프로그레스 바 -->
    <div class="w-full h-2 bg-gray-900 fixed top-0 left-0 z-50">
        <div id="progress-bar" class="h-full bg-[#E50914] w-full shadow-[0_0_10px_#E50914]"></div>
    </div>

    <!-- 헤더 영역 -->
    <header class="w-full max-w-7xl px-6 py-6 flex justify-between items-center z-10 mt-2">
        <!-- 넷플릭스 스타일 브랜드 타이틀 -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="resetTimer()">
            <div class="bg-[#E50914] text-black font-black px-3 py-1 rounded text-2xl tracking-tighter flex items-center justify-center shadow-lg">
                N
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-xl tracking-wider text-red-600 uppercase leading-none">CLASSROOM</span>
                <span class="text-xs tracking-widest text-gray-400 font-semibold uppercase">PRESENTATION TIMER</span>
            </div>
        </div>

        <!-- 우측 상태 및 전체화면 컨트롤 -->
        <div class="flex items-center space-x-3">
            <!-- 사운드 토글 버튼 -->
            <button id="sound-toggle-btn" onclick="toggleSound()" class="px-3 py-2 rounded-full bg-gray-900 hover:bg-gray-800 border border-gray-700 text-gray-300 hover:text-white text-sm transition flex items-center space-x-2" title="사운드 온/오프">
                <i id="sound-icon" class="fas font-solid fa-volume-high text-red-500"></i>
                <span id="sound-status-text" class="hidden sm:inline text-xs font-semibold">소리 켜짐</span>
            </button>

            <!-- 전체화면 버튼 -->
            <button onclick="toggleFullscreen()" class="px-3 py-2 rounded-full bg-gray-900 hover:bg-gray-800 border border-gray-700 text-gray-300 hover:text-white text-sm transition flex items-center space-x-2" title="전체화면 (F)">
                <i class="fas fa-expand"></i>
                <span class="hidden sm:inline text-xs font-semibold">전체화면</span>
            </button>
        </div>
    </header>

    <!-- 메인 타이머 디스플레이 영역 (정중앙) -->
    <main class="flex-1 flex flex-col justify-center items-center w-full px-4 my-auto relative z-10">
        
        <!-- 상태 메시지 배지 -->
        <div id="status-badge" class="mb-4 px-4 py-1.5 rounded-full bg-red-950/60 border border-red-800/50 text-red-400 font-medium text-sm tracking-wide uppercase flex items-center space-x-2 opacity-0 transition-opacity duration-300">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            <span id="status-text">발표 진행 중</span>
        </div>

        <!-- 대형 카운트다운 타이머 텍스트 -->
        <div class="relative flex justify-center items-center w-full max-w-5xl my-2">
            <div id="timer-display" class="font-timer text-[22vw] sm:text-[180px] md:text-[220px] lg:text-[260px] leading-none text-white white-glow tracking-wider transition-colors duration-300 select-none cursor-pointer" onclick="toggleStartPause()">
                05:00
            </div>
        </div>

        <!-- 긴박 메시지 (10초 미만 시 노출) -->
        <div id="warning-message" class="h-8 text-red-500 font-extrabold text-lg sm:text-xl tracking-widest uppercase opacity-0 transition-opacity duration-300 flex items-center space-x-2">
            <i class="fas fa-triangle-exclamation animate-bounce"></i>
            <span>시간이 얼마 남지 않았습니다! 마무리를 준비하세요!</span>
        </div>

    </main>

    <!-- 하단 컨트롤 패널 -->
    <footer class="w-full max-w-4xl px-4 pb-8 pt-2 z-10 flex flex-col items-center space-y-6">
        
        <!-- 1. 빠른 시간 설정 프리셋 버튼 -->
        <div class="flex flex-wrap justify-center gap-2 sm:gap-3 w-full">
            <button onclick="setPresetTime(10)" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300 flex items-center space-x-1.5">
                <i class="fas fa-bolt text-yellow-500 text-xs"></i>
                <span>10초</span>
            </button>
            <button onclick="setPresetTime(60)" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300 active">
                <span>1분</span>
            </button>
            <button onclick="setPresetTime(180)" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300">
                <span>3분</span>
            </button>
            <button onclick="setPresetTime(300)" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300">
                <span>5분</span>
            </button>
            <button onclick="setPresetTime(600)" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300">
                <span>10분</span>
            </button>
            <!-- 직접 입력 버튼 -->
            <button onclick="openCustomTimeModal()" class="btn-preset px-4 py-2.5 rounded-xl text-sm font-bold text-gray-300 border-dashed border-gray-600 hover:border-white">
                <i class="fas fa-pen text-xs"></i>
                <span>직접입력</span>
            </button>
        </div>

        <!-- 2. 주 조작 버튼 [시작] [정지/일시정지] [리셋] -->
        <div class="flex items-center justify-center space-x-4 sm:space-x-6 w-full">
            <!-- 시작 / 일시정지 메인 버튼 -->
            <button id="start-pause-btn" onclick="toggleStartPause()" class="btn-netflix min-w-[140px] sm:min-w-[180px] py-4 px-8 rounded-full font-black text-lg sm:text-xl tracking-wider uppercase text-white shadow-xl flex items-center justify-center space-x-3">
                <i id="start-icon" class="fas fa-play text-sm"></i>
                <span id="start-btn-text">시작</span>
            </button>

            <!-- 정지 / 일시정지 버튼 -->
            <button id="stop-btn" onclick="pauseTimer()" class="btn-secondary py-4 px-6 sm:px-8 rounded-full font-bold text-base sm:text-lg tracking-wider text-gray-300 hover:text-white flex items-center justify-center space-x-2">
                <i class="fas fa-pause text-sm"></i>
                <span>일시정지</span>
            </button>

            <!-- 리셋 버튼 -->
            <button onclick="resetTimer()" class="btn-secondary py-4 px-6 sm:px-8 rounded-full font-bold text-base sm:text-lg tracking-wider text-gray-300 hover:text-white flex items-center justify-center space-x-2">
                <i class="fas fa-rotate-left text-sm"></i>
                <span>리셋</span>
            </button>
        </div>

        <!-- 키보드 단축키 안내 -->
        <div class="text-xs text-gray-500 flex items-center space-x-4 pt-2 font-medium">
            <span><kbd class="px-1.5 py-0.5 bg-gray-800 rounded border border-gray-700 text-gray-300">Space</kbd> 시작/일시정지</span>
            <span><kbd class="px-1.5 py-0.5 bg-gray-800 rounded border border-gray-700 text-gray-300">R</kbd> 리셋</span>
            <span><kbd class="px-1.5 py-0.5 bg-gray-800 rounded border border-gray-700 text-gray-300">F</kbd> 전체화면</span>
        </div>
    </footer>

    <!-- 사용자 지정 시간 입력 모달 -->
    <dialog id="custom-time-modal" class="p-6 rounded-2xl bg-gray-900 text-white border border-gray-800 shadow-2xl max-w-sm w-full">
        <form method="dialog" class="flex flex-col space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h3 class="text-lg font-bold text-red-500 flex items-center space-x-2">
                    <i class="fas fa-clock"></i>
                    <span>시간 직접 설정</span>
                </h3>
                <button type="button" onclick="closeCustomTimeModal()" class="text-gray-400 hover:text-white">
                    <i class="fas fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-4 my-2">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-semibold">분 (Minutes)</label>
                    <input type="number" id="custom-minutes" min="0" max="99" value="3" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xl font-bold text-white text-center focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1 font-semibold">초 (Seconds)</label>
                    <input type="number" id="custom-seconds" min="0" max="59" value="0" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xl font-bold text-white text-center focus:outline-none focus:border-red-500">
                </div>
            </div>

            <div class="flex space-x-3 pt-2">
                <button type="button" onclick="applyCustomTime()" class="btn-netflix flex-1 py-2.5 rounded-lg font-bold text-sm text-white">
                    확인
                </button>
                <button type="button" onclick="closeCustomTimeModal()" class="btn-secondary flex-1 py-2.5 rounded-lg font-bold text-sm text-gray-300">
                    취소
                </button>
            </div>
        </form>
    </dialog>

    <script>
        // ==========================================
        // 1. 타이머 데이터 상태 관리
        // ==========================================
        let initialTimeSeconds = 300; // 기본 5분
        let remainingSeconds = 300;
        let timerInterval = null;
        let isRunning = false;
        let soundEnabled = true;

        // HTML DOM 엘리먼트 참조
        const timerDisplay = document.getElementById('timer-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startIcon = document.getElementById('start-icon');
        const startBtnText = document.getElementById('start-btn-text');
        const progressBar = document.getElementById('progress-bar');
        const warningMessage = document.getElementById('warning-message');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const customModal = document.getElementById('custom-time-modal');
        const soundIcon = document.getElementById('sound-icon');
        const soundStatusText = document.getElementById('sound-status-text');

        // ==========================================
        // 2. Web Audio API 사운드 엔진 (네트워크 의존 없이 100% 동작)
        // ==========================================
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 10초 카운트다운 틱(Tick) 소리
        function playTickSound() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 톤
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.warn("Audio playback issue:", e);
            }
        }

        // 시간 종료 알람 소리 (삐- 삐- 삐- 3회 경고음)
        function playFinishAlarm() {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 3번 연달아 울리는 비프음 신시사이저
                const beepTimes = [0, 0.25, 0.5, 0.75, 1.1];
                
                beepTimes.forEach((delay, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    // 마지막 비프는 더 긴 강렬한 톤
                    const isLast = idx === beepTimes.length - 1;
                    const duration = isLast ? 0.6 : 0.15;
                    const freq = isLast ? 1200 : 950;

                    osc.type = 'sawtooth'; // 강렬한 넷플릭스 경고음 느낌
                    osc.frequency.setValueAtTime(freq, now + delay);

                    gain.gain.setValueAtTime(0.5, now + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + delay);
                    osc.stop(now + delay + duration);
                });
            } catch (e) {
                console.warn("Audio alarm issue:", e);
            }
        }

        // ==========================================
        // 3. UI 업데이트 및 렌더링 함수
        // ==========================================
        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            const formattedMins = String(mins).padStart(2, '0');
            const formattedSecs = String(secs).padStart(2, '0');
            return `${formattedMins}:${formattedSecs}`;
        }

        function updateDisplay() {
            // 시간 텍스트 업데이트
            timerDisplay.textContent = formatTime(remainingSeconds);

            // 문서 타이틀 반영
            document.title = `(${formatTime(remainingSeconds)}) 넷플릭스 타이머`;

            // 프로그레스 바 비율 계산
            const percentage = initialTimeSeconds > 0 ? (remainingSeconds / initialTimeSeconds) * 100 : 0;
            progressBar.style.width = `${Math.max(0, Math.min(100, percentage))}%`;

            // 10초 미만 연출 조건문
            if (remainingSeconds <= 10 && remainingSeconds > 0 && isRunning) {
                timerDisplay.classList.add('animate-urgent');
                timerDisplay.classList.remove('white-glow');
                document.body.classList.add('bg-urgent-pulse');
                warningMessage.classList.remove('opacity-0');
                progressBar.style.backgroundColor = '#E50914';
            } else if (remainingSeconds === 0) {
                timerDisplay.classList.add('animate-urgent');
                timerDisplay.classList.remove('white-glow');
                document.body.classList.remove('bg-urgent-pulse');
                warningMessage.classList.remove('opacity-0');
            } else {
                timerDisplay.classList.remove('animate-urgent');
                timerDisplay.classList.add('white-glow');
                document.body.classList.remove('bg-urgent-pulse');
                warningMessage.classList.add('opacity-0');
                progressBar.style.backgroundColor = '#E50914';
            }
        }

        // ==========================================
        // 4. 타이머 제어 로직 (시작/정지/리셋)
        // ==========================================
        function startTimer() {
            if (isRunning) return;
            if (remainingSeconds <= 0) return;

            // 오디오 컨텍스트 활성화
            getAudioContext();

            isRunning = true;
            
            // 버튼 상태 UI 업데이트
            startBtnText.textContent = "일시정지";
            startIcon.className = "fas fa-pause text-sm";
            startPauseBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');

            // 상태 배지 업데이트
            statusBadge.classList.remove('opacity-0');
            statusText.textContent = "발표 진행 중";

            timerInterval = setInterval(() => {
                remainingSeconds--;

                // 10초 이하 틱 소리
                if (remainingSeconds <= 10 && remainingSeconds > 0) {
                    playTickSound();
                }

                updateDisplay();

                // 시간이 0초가 되었을 때
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    onTimerFinished();
                }
            }, 1000);

            updateDisplay();
        }

        function pauseTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;

            // 버튼 상태 UI 업데이트
            startBtnText.textContent = "계속";
            startIcon.className = "fas fa-play text-sm";
            startPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');

            // 상태 배지 업데이트
            statusText.textContent = "일시 정지됨";
            timerDisplay.classList.remove('animate-urgent');
            document.body.classList.remove('bg-urgent-pulse');
        }

        function toggleStartPause() {
            if (isRunning) {
                pauseTimer();
            } else {
                if (remainingSeconds <= 0) {
                    resetTimer();
                }
                startTimer();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = initialTimeSeconds;

            // UI 복원
            startBtnText.textContent = "시작";
            startIcon.className = "fas fa-play text-sm";
            startPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
            statusBadge.classList.add('opacity-0');

            updateDisplay();
        }

        function onTimerFinished() {
            // 버튼 상태 복원
            startBtnText.textContent = "재시작";
            startIcon.className = "fas fa-rotate-right text-sm";
            startPauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');

            statusText.textContent = "발표 시간 종료!";
            statusBadge.classList.remove('opacity-0');

            // 종료 경고음 재생
            playFinishAlarm();
        }

        // ==========================================
        // 5. 프리셋 및 사용자 설정
        // ==========================================
        function setPresetTime(seconds) {
            initialTimeSeconds = seconds;
            
            // 모든 프리셋 버튼의 active 클래스 제거 후 클릭된 것만 활성화
            const buttons = document.querySelectorAll('.btn-preset');
            buttons.forEach(btn => btn.classList.remove('active'));

            // 클릭 이벤트 발생 요소 강조
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            resetTimer();
        }

        function openCustomTimeModal() {
            pauseTimer();
            customModal.showModal();
        }

        function closeCustomTimeModal() {
            customModal.close();
        }

        function applyCustomTime() {
            const mins = parseInt(document.getElementById('custom-minutes').value) || 0;
            const secs = parseInt(document.getElementById('custom-seconds').value) || 0;
            const total = (mins * 60) + secs;

            if (total > 0) {
                initialTimeSeconds = total;
                
                // 프리셋 버튼 active 해제
                document.querySelectorAll('.btn-preset').forEach(btn => btn.classList.remove('active'));
                
                resetTimer();
                closeCustomTimeModal();
            }
        }

        // 소리 토글
        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.className = "fas fa-volume-high text-red-500";
                soundStatusText.textContent = "소리 켜짐";
            } else {
                soundIcon.className = "fas fa-volume-xmark text-gray-500";
                soundStatusText.textContent = "음소거";
            }
        }

        // 전체화면 토글
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Fullscreen error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // ==========================================
        // 6. 키보드 단축키 지원
        // ==========================================
        window.addEventListener('keydown', (e) => {
            // 모달 열려있을 때는 키보드 단축키 비활성화
            if (customModal.open) return;

            if (e.code === 'Space') {
                e.preventDefault();
                toggleStartPause();
            } else if (e.code === 'KeyR') {
                e.preventDefault();
                resetTimer();
            } else if (e.code === 'KeyF') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        // 초기 디스플레이 설정
        updateDisplay();
    </script>
</body>
</html>
